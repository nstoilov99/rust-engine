name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Primary: Windows (matches dev environment)
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (default features)
        run: cargo build --workspace

      - name: Build (editor feature)
        run: cargo build -p game_client --features editor

      - name: Test (default features)
        run: cargo test --workspace --lib --tests

      - name: Test (editor feature)
        run: cargo test --workspace --lib --tests --features editor

      - name: Clippy (default features)
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings

      - name: Clippy (editor feature)
        run: cargo clippy --workspace --lib --bins --tests --features editor -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check

  # Crusty design-system lint: no raw hex outside the token module, 2px
  # reserved for the active-tab / type edge. Fixture-tested (DESIGN.md ▸
  # Lint: "the job must pass on a clean tree and fail on a seeded violation,
  # and the fixture pair lives beside it").
  design_lint:
    name: Design lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Lint (clean tree must pass)
        run: bash scripts/lint_design.sh

      - name: Selftest (fixtures must fail, near-misses must not)
        run: bash scripts/lint_design.sh --selftest

  # `game_shared` must stay compatible with the server WASM target (M2/M5),
  # and the graph interpreter with it (Task 45-A D8: the whole point of
  # `node_graph_exec` being a leaf crate is that it can later compile into the
  # SpacetimeDB module unchanged). Both catch std/engine dependency creep the
  # day it happens rather than the day the server needs them.
  wasm32:
    name: wasm32 (game_shared, graph interpreter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check game_shared for wasm32
        run: cargo check -p game_shared --target wasm32-unknown-unknown

      # Standalone first — a crate that only builds as part of the workspace's
      # feature unification is not actually portable — then for wasm32.
      - name: Check the graph crates standalone
        run: cargo check -p node_graph_types -p node_graph_exec -p curve_asset

      - name: Check the graph crates for wasm32
        run: cargo check -p node_graph_types -p node_graph_exec -p curve_asset --target wasm32-unknown-unknown

  # Optional: Linux for cross-platform validation
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (default features)
        run: cargo build --workspace

      - name: Test (default features)
        run: cargo test --workspace --lib --tests

      - name: Clippy (default features)
        run: cargo clippy --workspace --lib --bins --tests -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
