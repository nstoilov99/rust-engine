[package]
name = "rust_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_engine"
path = "src/lib.rs"

[features]
default = ["graph-scripting"]
# Runtime HUD: crusty-gui without any editor machinery.
hud = ["dep:crusty-gui"]
# Editor UI is crusty-gui.
editor = ["hud", "dep:windows-sys", "dep:transform-gizmo", "dep:arboard", "dep:notify", "dep:tokio", "dep:shaderc", "dep:resvg"]
# Alias kept for muscle memory — crusty-gui is the only editor UI.
crusty = ["editor"]
editor-debug = ["editor"]
# Registers the node_graph test/demo node set in the editor (Task 40) —
# lets the graph editor be exercised before consumer tasks ship real nodes.
dev_nodes = []
# Graph scripting: the node-graph interpreter, the GraphRunner system and the
# graph_scripting plugin. Default-on, and a real gate — `node_graph_exec` is a
# leaf crate, so turning this off genuinely strips the interpreter from a
# build. The `GraphRunner` *component* is unconditional (scenes must round-trip
# either way); only the runtime is gated.
graph-scripting = ["dep:node_graph_exec"]
tracy = ["tracy-client"]

[dependencies]
# Workspace shared deps
glam = { workspace = true }
serde = { workspace = true }
uuid = { workspace = true }
nalgebra-glm = { workspace = true }
log = { workspace = true }

# Window and event handling
winit = "0.30"

# Vulkano - Safe Vulkan wrapper
vulkano = "0.35"

# Shader compilation at build time
vulkano-shaders = "0.35"

# Image loading (for textures later)
image = "0.25"

# SVG rasterization (editor only — used for hierarchy panel icons)
resvg = { version = "0.45", optional = true, default-features = false, features = ["text", "system-fonts"] }
bytemuck = "1.24.0"

gltf = "1.4"
tobj = "4.0"
ufbx = "0.10"

# Small vector optimization
smallvec = "1.13"

# ECS
hecs = "0.10"

# File watching for hot-reload (editor only)
notify = { version = "6.1", optional = true }

# Thread-safe locking primitives
parking_lot = "0.12"

# Bounded channels for render thread communication
crossbeam-channel = "0.5"

# Async runtime for background loading (editor only)
tokio = { version = "1.35", features = ["rt", "rt-multi-thread", "sync"], optional = true }

# Serialization
ron = "0.8"
typetag = "0.2"

# crusty-gui — in-house GUI library (path dep during development)
crusty-gui = { path = "../../crusty-gui", default-features = false, features = ["winit-window", "vulkano-renderer", "serde"], optional = true }

# Physics Engine (Rapier 3D)
rapier3d = "0.25"

# Profiling (Puffin core - custom egui integration will be implemented)
puffin = "0.19"

# Tracy profiler integration (optional - build with --features tracy)
tracy-client = { version = "0.17", optional = true, default-features = false, features = ["enable", "manual-lifetime"] }

# Transform gizmo for viewport manipulation (editor only; patched to the
# Z-up fork in the workspace root)
transform-gizmo = { version = "0.8", optional = true }
mint = "0.5"

# Clipboard support (editor only)
arboard = { version = "3.4", optional = true }

# Audio engine
kira = { version = "0.12", features = ["cpal", "symphonia"] }

# Gamepad input
gilrs = "0.11"

# Runtime shader compilation (editor only)
shaderc = { version = "0.8", optional = true }

# Atomic reference-counted pointer swap (for pipeline hot-reload)
arc-swap = "1"

# Shared gameplay types
game_shared = { path = "../game_shared" }

# Node graph derive macros (Task 40 P8) + inventory auto-registration backend
node_graph_macros = { path = "../crates/node_graph_macros" }
node_graph_types = { path = "../crates/node_graph_types" }
node_graph_exec = { path = "../crates/node_graph_exec", optional = true }
# 45-A P8: `.curve` assets — the engine owns file IO and AssetType, the crate
# owns the data and its evaluation. Unconditional since P8b: the curve editor
# is an `editor` concern and the descriptor resolver in `node_graph_types`
# (a hard dependency) already pulls it in, so gating bought nothing.
curve_asset = { path = "../crates/curve_asset" }
inventory = "0.3"

# Desktop-wide color sampling for the crusty eyedropper (editor only)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Task 39.8 P6 relaunch: ReplaceFileW for atomic config writes,
    # OpenProcess/WaitForSingleObject so the relaunched child waits on the
    # parent's process handle rather than polling a reusable pid.
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }
