[package]
name = "node_graph_types"
version = "0.1.0"
edition = "2021"

# The node graph document model, registry, descriptor resolver, validation and
# migration — extracted from the engine (Task 45-A P2) so the portable
# interpreter crate can consume them without depending on the engine.
#
# Dependency discipline: plain data only. No engine, no ECS, no Vulkan, no
# rendering, no wall-clock. `serde`/`ron` are the whole list, and both build
# for wasm32.

[dependencies]
serde = { workspace = true }
ron = "0.8"
