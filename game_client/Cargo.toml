[package]
name = "game_client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "game"
path = "src/main.rs"

[features]
default = ["hud", "graph-scripting"]
# In-game HUD (crusty-gui) in the standalone client.
hud = ["rust_engine/hud"]
# Editor UI is crusty-gui.
editor = ["rust_engine/editor"]
# Alias kept for muscle memory — crusty-gui is the only editor UI.
crusty = ["editor"]
editor-debug = ["editor", "rust_engine/editor-debug"]
# Registers the node_graph test/demo node set (Task 40) so the graph editor
# is exercisable before consumer tasks ship real nodes.
dev_nodes = ["rust_engine/dev_nodes"]
# Graph scripting: the interpreter, the runner system and the
# graph_scripting plugin. Default-on; turning it off strips the interpreter
# from the binary entirely (the export policy relies on that being true).
graph-scripting = ["rust_engine/graph-scripting"]
tracy = ["rust_engine/tracy"]

[dependencies]
rust_engine = { path = "../engine" }
game_shared = { path = "../game_shared" }
game_client_net = { path = "../game_client_net" }

# Workspace shared deps
glam = { workspace = true }
serde = { workspace = true }
nalgebra-glm = { workspace = true }
log = { workspace = true }
uuid = { workspace = true }

# Window and event handling
winit = "0.30"

# Vulkano (needed for descriptor sets, sync, buffers in game code)
vulkano = "0.35"

# ECS (needed for hecs::Entity, hecs::World in game code)
hecs = "0.10"

# Serialization (used in app.rs)
ron = "0.8"

# Thread-safe locking primitives
parking_lot = "0.12"

# Profiling
puffin = "0.19"

# Tracy profiler integration
tracy-client = { version = "0.17", optional = true, default-features = false, features = ["enable", "manual-lifetime"] }
