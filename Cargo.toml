[workspace]
members = [
    "engine",
    "game_shared",
    "game_client",
    "game_client_net",
    "tools/pak_tool",
    "tools/collision_cooker",
    "tools/greybox_gen",
    "tools/migrate_asset_extensions",
    "tools/net_bots",
    "crates/node_graph_macros",
    "crates/node_graph_types",
    "crates/node_graph_exec",
]
# SpacetimeDB module: built by the spacetime CLI toolchain, own lockfile.
exclude = ["server/game_module"]
resolver = "2"

[workspace.dependencies]
glam = { version = "0.29", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
nalgebra-glm = "0.18"
log = "0.4"

[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

# rustc 1.97.0 ICEs (STATUS_ACCESS_VIOLATION) compiling this crate with
# incremental + opt-level 3; drop to 2 until a fixed toolchain lands.
[profile.dev.package.transform-gizmo]
opt-level = 2

[profile.release]
opt-level = 3
lto = true

[profile.shipping]
inherits = "release"
strip = true
codegen-units = 1
panic = "abort"

[patch.crates-io]
emath = { path = "crates/emath-patched" }
transform-gizmo = { path = "crates/transform-gizmo-fork/crates/transform-gizmo" }
